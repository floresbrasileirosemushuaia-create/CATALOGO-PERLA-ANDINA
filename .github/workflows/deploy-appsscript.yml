name: PERLA ANDINA - Apps Script Cloud Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud-deploy/**'
      - '.github/workflows/deploy-appsscript.yml'

permissions:
  contents: read

concurrency:
  group: perla-andina-appsscript-production
  cancel-in-progress: false

env:
  SCRIPT_ID: 1WgBMyjVxd7x1e25OJOTSTwL8AFzq914pPEBdFfeHxawAmoNV84Q6yJgV
  DEPLOYMENT_ID: AKfycbx9H9BJTrwNXdORIrVwilUmQiCMq-enVm-HfXZjNjXKsudiklef9ZnMdc36ZtIsD7bB
  BACKEND_URL: https://script.google.com/macros/s/AKfycbx9H9BJTrwNXdORIrVwilUmQiCMq-enVm-HfXZjNjXKsudiklef9ZnMdc36ZtIsD7bB/exec
  CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preflight de credencial
        if: env.CLASPRC_JSON == ''
        run: |
          echo 'ERRO: CLASPRC_JSON ainda não foi cadastrado nos Secrets do repositório.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Nenhum arquivo do Apps Script foi alterado. O deploy NÃO foi executado.' >> "$GITHUB_STEP_SUMMARY"
          exit 2

      - name: Node 20
        if: env.CLASPRC_JSON != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar clasp 3.4.0
        if: env.CLASPRC_JSON != ''
        run: npm install -g @google/clasp@3.4.0

      - name: Preparar autenticação e projeto remoto
        if: env.CLASPRC_JSON != ''
        shell: bash
        run: |
          set -euo pipefail
          AUTH="$RUNNER_TEMP/.clasprc.json"
          printf '%s' "$CLASPRC_JSON" > "$AUTH"
          chmod 600 "$AUTH"
          mkdir -p "$RUNNER_TEMP/perla-remote" "$RUNNER_TEMP/perla-verify"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > "$RUNNER_TEMP/perla-remote/.clasp.json"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > "$RUNNER_TEMP/perla-verify/.clasp.json"
          echo "AUTH=$AUTH" >> "$GITHUB_ENV"
          echo "REMOTE=$RUNNER_TEMP/perla-remote" >> "$GITHUB_ENV"
          echo "VERIFY=$RUNNER_TEMP/perla-verify" >> "$GITHUB_ENV"

      - name: Backup remoto antes de qualquer alteração
        if: env.CLASPRC_JSON != ''
        shell: bash
        run: |
          set -euo pipefail
          cd "$REMOTE"
          clasp pull -A "$AUTH"
          test -f appsscript.json

      - name: Guardar backup como artefato
        if: env.CLASPRC_JSON != ''
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-backup-before-${{ github.run_id }}
          path: ${{ env.REMOTE }}
          include-hidden-files: true
          retention-days: 30

      - name: Aplicar patch cirúrgico V2.5.3
        if: env.CLASPRC_JSON != ''
        run: node cloud-deploy/apply_patch.js "$REMOTE" cloud-deploy/patch-plan.json

      - name: Validar sintaxe do Apps Script preparado
        if: env.CLASPRC_JSON != ''
        shell: bash
        run: |
          set -euo pipefail
          for f in "$REMOTE"/*.js "$REMOTE"/*.gs; do
            [ -e "$f" ] || continue
            node -e "const fs=require('fs'),vm=require('vm');new vm.Script(fs.readFileSync(process.argv[1],'utf8'),{filename:process.argv[1]});" "$f"
          done
          node --check cloud-deploy/apply_patch.js
          node --check cloud-deploy/compare_remote.js

      - name: Confirmar o MESMO deployment antes do push
        if: env.CLASPRC_JSON != ''
        shell: bash
        run: |
          set -euo pipefail
          cd "$REMOTE"
          clasp list-deployments --json -A "$AUTH" > "$RUNNER_TEMP/deployments-before.json"
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const id=process.argv[2];const s=JSON.stringify(x);if(!s.includes(id)){console.error('Deployment alvo não encontrado');process.exit(2)}" "$RUNNER_TEMP/deployments-before.json" "$DEPLOYMENT_ID"

      - name: Push para o projeto Apps Script existente
        if: env.CLASPRC_JSON != ''
        shell: bash
        run: |
          set -euo pipefail
          cd "$REMOTE"
          clasp push --force -A "$AUTH"

      - name: Atualizar a MESMA implantação Web App
        if: env.CLASPRC_JSON != ''
        shell: bash
        run: |
          set -euo pipefail
          cd "$REMOTE"
          clasp create-deployment --deploymentId "$DEPLOYMENT_ID" --description 'V2.5.3 PERLA ANDINA - Apps Script sincronizado' --json -A "$AUTH" > "$RUNNER_TEMP/deploy-result.json"

      - name: Pull final e comparação integral
        if: env.CLASPRC_JSON != ''
        shell: bash
        run: |
          set -euo pipefail
          cd "$VERIFY"
          clasp pull -A "$AUTH"
          node "$GITHUB_WORKSPACE/cloud-deploy/compare_remote.js" "$REMOTE" "$VERIFY"

      - name: Verificar produção Apps Script V2.5.3
        if: env.CLASPRC_JSON != ''
        shell: bash
        run: |
          set -euo pipefail
          TS=$(date +%s)
          curl -fsSL --retry 5 --retry-delay 4 "$BACKEND_URL?health=1&t=$TS" -o "$RUNNER_TEMP/apps-health.json"
          cat "$RUNNER_TEMP/apps-health.json"
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));if(!x.ok||x.version!=='2.5.3'||x.rawUi!==true){console.error(x);process.exit(2)}" "$RUNNER_TEMP/apps-health.json"
          curl -fsSL --retry 5 --retry-delay 4 "$BACKEND_URL?raw_ui=1&t=$TS" -o "$RUNNER_TEMP/apps-ui.html"
          grep -Eqi '<html([[:space:]>])' "$RUNNER_TEMP/apps-ui.html"
          grep -Fq 'V2.5.3 PERLA ANDINA' "$RUNNER_TEMP/apps-ui.html"
          curl -fsSL --retry 3 --retry-delay 3 'https://perlaandinacatalogo.vercel.app/api/health' -o "$RUNNER_TEMP/vercel-health.json"
          cat "$RUNNER_TEMP/vercel-health.json"
          echo 'Apps Script V2.5.3 atualizado no mesmo deployment, comparado integralmente e validado por health/raw_ui.' >> "$GITHUB_STEP_SUMMARY"
