name: PERLA ANDINA - Promover V2.5.1 sem rebuild

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/relink-vercel-v249.yml'

permissions:
  contents: read

concurrency:
  group: perla-andina-promote-v251
  cancel-in-progress: false

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_TEAM: nando-floress-projects
  VERCEL_ORG_ID: team_8im99AihVvcpTyGP3sW2J2DQ
  VERCEL_PROJECT_ID: prj_hZqYgzGZTNl1kGPZnkBcR4BlHSWV
  PUBLIC_URL: https://perlaandinacatalogo.vercel.app
  V251_DEPLOYMENT: dpl_67N9HjSGWoaMjXkPs2mWjJeXzti2
  V251_DEPLOYMENT_URL: https://perlaandinacatalogo-dcr2pt11l-nando-floress-projects.vercel.app
  ROLLBACK_DEPLOYMENT: dpl_Dnc6qejZ6FyaLVVM7CBgr7R4AnaF

jobs:
  promote-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validar token Vercel
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN ausente nos Secrets do repositório.' >&2
            exit 2
          fi

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Fixar projeto Vercel correto
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Confirmar implantação V2.5.1 READY
        shell: bash
        run: |
          set -euo pipefail
          vercel inspect "$V251_DEPLOYMENT_URL" --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM" > "$RUNNER_TEMP/inspect.txt"
          cat "$RUNNER_TEMP/inspect.txt"
          grep -qi 'ready' "$RUNNER_TEMP/inspect.txt"

      - name: Promover V2.5.1 para produção sem rebuild
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          vercel promote "$V251_DEPLOYMENT" --yes --timeout=5m --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM"
          echo 'promoted=true' >> "$GITHUB_OUTPUT"

      - name: Validar health da produção
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 3 "$PUBLIC_URL/api/health?t=$(date +%s)" -o "$RUNNER_TEMP/health.json"
          cat "$RUNNER_TEMP/health.json"
          node - "$RUNNER_TEMP/health.json" <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(x.ok!==true) throw new Error('health ok != true');
          if(String(x.version)!=='2.5.1') throw new Error('versão em produção != 2.5.1');
          if(String(x.portal)!=='perlaandinacatalogo') throw new Error('portal incorreto');
          if(x.backendConfigured!==true) throw new Error('backend não configurado');
          console.log('HEALTH V2.5.1 OK');
          NODE

      - name: Validar interface V2.5.1 real
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 3 "$PUBLIC_URL/api/ui?t=$(date +%s)" -o "$RUNNER_TEMP/ui.html"
          BYTES=$(wc -c < "$RUNNER_TEMP/ui.html")
          echo "UI bytes: $BYTES"
          test "$BYTES" -gt 100000
          grep -qi '<html' "$RUNNER_TEMP/ui.html"
          grep -qi 'Perla Andina' "$RUNNER_TEMP/ui.html"
          grep -Eqi '(V|version[:[:space:]]*)?2\.5\.1' "$RUNNER_TEMP/ui.html"
          echo 'INTERFACE V2.5.1 OK'

      - name: Validar loader público
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 3 "$PUBLIC_URL/?t=$(date +%s)" -o "$RUNNER_TEMP/root.html"
          grep -qi 'Perla Andina' "$RUNNER_TEMP/root.html"
          echo 'LOADER PÚBLICO OK'

      - name: Validar gateway de notificações
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o "$RUNNER_TEMP/config.json" -w '%{http_code}' --retry 5 --retry-all-errors --retry-delay 2 "$PUBLIC_URL/api/config?t=$(date +%s)")
          cat "$RUNNER_TEMP/config.json" || true
          node - "$RUNNER_TEMP/config.json" "$CODE" <<'NODE'
          const fs=require('fs');
          const p=process.argv[2], code=Number(process.argv[3]);
          const raw=fs.readFileSync(p,'utf8');
          let x={}; try{x=JSON.parse(raw||'{}')}catch(e){throw new Error('config não retornou JSON')}
          if(![200,503].includes(code)) throw new Error('HTTP inesperado no config: '+code);
          if(x.version && String(x.version)!=='2.5.1') throw new Error('gateway em versão incorreta');
          console.log('GATEWAY RESPONDEU; configured='+String(x.configured));
          NODE

      - name: Resultado final
        run: echo 'V2.5.1 PERLA ANDINA PUBLICADA E VALIDADA EM PRODUÇÃO.'

      - name: Rollback automático se a validação falhar
        if: failure() && steps.promote.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo 'Validação falhou. Restaurando produção anterior automaticamente.'
          vercel promote "$ROLLBACK_DEPLOYMENT" --yes --timeout=5m --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM"
          sleep 5
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$PUBLIC_URL/api/health?t=$(date +%s)" || true
