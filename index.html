<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17324d">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Perla Andina</title>
  <style>
    html,body{height:100%;margin:0}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;background:#f4f7f9;color:#17324d}.box{text-align:center;padding:24px}.spinner{width:30px;height:30px;border:3px solid #d9e5eb;border-top-color:#17324d;border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}.err{max-width:520px;line-height:1.45}button{padding:10px 14px;border:0;border-radius:10px;background:#17324d;color:#fff;font-weight:700;cursor:pointer}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="box" id="loader"><div class="spinner"></div><strong>Carregando Perla Andina...</strong></main>
  <script>
    // V2.5.1 PERLA ANDINA — destino de produção: perlaandinacatalogo.vercel.app; URL limpa em /menu.
    (async function(){
      try{
        if(location.pathname==='/'||location.pathname==='/menu'){
          const clean='/menu'+(location.hash||'');
          if(location.pathname!=='/menu'||location.search)history.replaceState(null,'',clean);
        }
        const r=await fetch('/api/ui?v=251',{cache:'no-store',credentials:'same-origin'});
        const html=await r.text();
        if(!r.ok||!/<html[\s>]/i.test(html))throw new Error('Não foi possível carregar o portal.');
        document.open();document.write(html);document.close();
      }catch(err){
        document.getElementById('loader').innerHTML='<div class="err"><h2>Perla Andina</h2><p>'+String(err&&err.message||err)+'</p><button onclick="location.reload()">Tentar novamente</button></div>';
      }
    })();
  </script>
</body>
</html>
